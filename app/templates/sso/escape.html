<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Open in Browser — Legion SSO</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <style>
    body {
      background: #0a0a0a; color: #f0e8e8; display: flex; align-items: center;
      justify-content: center; min-height: 100vh; margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .card-box { background: #111111; border: 1px solid #2a1a1a; border-radius: 10px; padding: 2rem; width: 380px; text-align: center; }
    .card-box h1 { color: #cc2200; font-size: 1.3rem; font-weight: 700; margin: 0 0 .75rem; }
    .text-muted { color: #9a7878; margin: 0; }
    .btn { display: inline-block; margin-top: 1.25rem; padding: .6rem 1.25rem; background: #cc2200; color: #fff; text-decoration: none; border-radius: 6px; font-weight: 600; }
  </style>
</head>
<body>
  <div class="card-box">
    <h1>Opening your browser&hellip;</h1>
    <p class="text-muted">Slack's built-in browser doesn't stay signed in between taps. Sign-in needs your regular browser.</p>
    <a class="btn" href="{{ escape_url }}">Open in Browser</a>
  </div>
  <script>window.location.replace({{ escape_url | tojson }});</script>
</body>
</html>
